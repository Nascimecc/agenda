<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda de Consultas — Ednaldo e Elaine</title>
<meta name="theme-color" content="#2563eb">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📅</text></svg>">
<script>(function(){var t=null;try{t=localStorage.getItem('agenda-tema')}catch(e){}if(t!=='claro'&&t!=='escuro'){t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'escuro':'claro'}document.documentElement.dataset.tema=t;})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --ink:#1b1f27; --mute:#6b7280; --line:#e5e7eb;
  --ok:#16a34a; --okbg:#dcfce7; --warn:#b45309; --warnbg:#fef3c7;
  --bad:#b91c1c; --badbg:#fee2e2; --lock:#7c2d12; --lockbg:#ffedd5;
  --p:#2563eb; --pbg:#dbeafe;
}
body[data-prof="elaine"]{ --p:#9333ea; --pbg:#f3e8ff; }
:root[data-tema="escuro"]{ --bg:#0f1115; --card:#181b21; --ink:#e8eaee; --mute:#9aa1ad; --line:#2a2f38;
    --okbg:#12331f; --warnbg:#3a2a0b; --badbg:#3b1414; --lockbg:#3a1d0c; --pbg:#172554; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --lock:#fdba74;}
  :root[data-tema="escuro"] body[data-prof="elaine"]{ --pbg:#2e1065; }

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:12px 12px 90px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 2px 10px}
h1{font-size:18px;margin:0;font-weight:700}
.sub{color:var(--mute);font-size:12px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:9px 10px;border-radius:9px;font-weight:600;cursor:pointer;color:var(--mute)}
.seg button.on{background:var(--p);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.card h3{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 11px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip b{color:var(--p)}
.chip.on{background:var(--p);color:#fff;border-color:var(--p)}
.alert{background:var(--badbg);border-color:transparent}
.alert h3{color:var(--bad)}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px;cursor:pointer;font-weight:600}
.btn.p{background:var(--p);border-color:var(--p);color:#fff}
.btn.d{color:var(--bad)}
.btn.sm{padding:6px 9px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon{border:0;background:transparent;font-size:20px;padding:6px 10px;cursor:pointer;color:var(--ink)}
/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.calhead b{font-size:16px;text-transform:capitalize}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.dow{font-size:11px;color:var(--mute);text-align:center;font-weight:600;padding:2px 0}
.day{min-height:74px;border:1px solid var(--line);border-radius:9px;padding:4px;cursor:pointer;background:var(--card);display:flex;flex-direction:column;gap:3px;overflow:hidden}
.day.out{opacity:.35}
.day.past{opacity:.55}
.day.today{outline:2px solid var(--p);outline-offset:-1px}
.day.hol{background:var(--lockbg)}
.day .n{font-size:12px;font-weight:700}
.day .hn{font-size:9px;color:var(--lock);line-height:1.1}
.pill{font-size:10.5px;border-radius:5px;padding:2px 4px;font-weight:600;white-space:nowrap;line-height:1.25}
.s-free{background:var(--okbg);color:var(--ok)}
.s-full{background:var(--warnbg);color:var(--warn)}
.s-over{background:var(--badbg);color:var(--bad)}
.s-lock{background:var(--lockbg);color:var(--lock)}
.s-none{color:var(--mute)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
/* lists */
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.item .t{flex:1;min-width:0}
.item .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t small{color:var(--mute)}
.tag{font-size:11px;padding:2px 6px;border-radius:5px;background:var(--badbg);color:var(--bad);font-weight:600}
.tag.x{background:var(--warnbg);color:var(--warn)}
.nota{font-size:12.5px;margin-top:4px;padding:5px 8px;border-radius:7px;background:var(--pbg);white-space:pre-wrap;word-break:break-word;line-height:1.35}
.empty{color:var(--mute);font-size:13px;padding:6px 2px}
/* forms */
label.f{display:block;font-size:12px;color:var(--mute);margin:8px 0 4px;font-weight:600}
.in{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px}
.vgrid{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;align-items:center}
.vgrid input{width:100%;text-align:center}
/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs .in2{display:flex;max-width:760px;width:100%}
nav.tabs button{flex:1;border:0;background:none;padding:9px 2px 8px;font-size:10.5px;color:var(--mute);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600;position:relative}
nav.tabs button span.e{font-size:18px}
nav.tabs button.on{color:var(--p)}
.badge{position:absolute;top:4px;right:calc(50% - 22px);background:var(--bad);color:#fff;border-radius:999px;font-size:10px;padding:1px 5px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--card);border-radius:18px 18px 0 0;z-index:11;padding:14px 14px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .22s ease;max-width:760px;margin:0 auto}
.sheet.on{transform:none}
.sheet h2{font-size:17px;margin:0}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 10px}
.turno{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px}
.turno.lock{background:var(--lockbg);border-color:transparent}
.turno .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.turno .hd b{font-size:15px}
.lockmsg{color:var(--lock);font-size:13px;font-weight:600}
.addrow{display:flex;gap:6px;margin-top:8px}
.addrow .in{padding:9px}
.mover{position:sticky;top:0;z-index:4;background:var(--p);color:#fff;border-radius:12px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.mover button{background:#fff;color:var(--p);border:0;border-radius:8px;padding:6px 10px;font-weight:700}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 14px;border-radius:12px;font-size:13.5px;z-index:20;max-width:92vw;box-shadow:0 6px 24px rgba(0,0,0,.25);display:none}
.toast.on{display:block}
.undo{background:#fff;color:#111827;border:0;border-radius:8px;padding:5px 10px;font-weight:700;margin-left:8px;cursor:pointer}
.banner{font-size:12px;padding:8px 10px;border-radius:10px;background:var(--warnbg);color:var(--warn);margin-bottom:8px}
.hidden{display:none!important}
.pw{position:relative}
.pw .in{padding-right:46px}
.olho{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;background:transparent;cursor:pointer;color:var(--mute);display:flex;align-items:center;justify-content:center;border-radius:8px}
.olho:hover{color:var(--ink)}
.olho svg{width:20px;height:20px}
.equipe{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.eqp{font-size:12px;padding:3px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--ink)}
.eqp.eu{background:var(--pbg);border-color:transparent}
.eqp.ext{border-color:var(--warn)} .eqp.ext small{color:var(--warn);font-weight:600}
.chat{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.msg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 11px;max-width:92%;align-self:flex-start}
.msg.eu{align-self:flex-end;background:var(--pbg);border-color:transparent}
.msg.pramim{border:2px solid var(--p)}
.msg.feito{opacity:.6}
.msg .mh{font-size:12px;color:var(--mute);display:flex;gap:6px;flex-wrap:wrap;align-items:baseline}
.msg .mh b{color:var(--ink)} .msg .mh span{margin-left:auto}
.msg .mt{white-space:pre-wrap;word-break:break-word;font-size:14.5px;margin-top:3px;line-height:1.4}
.msg .ma{display:flex;gap:10px;align-items:center;margin-top:6px;flex-wrap:wrap}
.lnk{border:0;background:none;color:var(--p);font-size:12.5px;font-weight:600;cursor:pointer;padding:2px 0}
.login{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.logbox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 22px;max-width:380px;width:100%;text-align:center}
.mini{font-size:12px;color:var(--mute)}
.switch{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.switch:last-child{border:0}
</style>
</head>
<body data-prof="ednaldo">
<div id="login" class="login">
  <div class="logbox">
    <div style="font-size:44px">📅</div>
    <h1 style="font-size:22px;margin:6px 0 4px">Agenda de Consultas</h1>
    <div class="mini" style="margin-bottom:18px">Ednaldo e Elaine · Equipe Dr. João Clementino</div>
    <div id="logMsg" class="mini" style="margin-bottom:14px">Cada ACS vê só os próprios pacientes; bloqueios e dias lotados são da equipe.</div>
    <form id="formLogin" autocomplete="on" style="text-align:left">
      <label class="f">Usuário</label><input class="in" id="logUser" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
      <label class="f">Senha</label><div class="pw"><input class="in" id="logPass" type="password" autocomplete="current-password"><button type="button" class="olho" data-olho tabindex="-1" aria-label="Mostrar senha" title="Mostrar senha"></button></div>
      <button class="btn p" id="btnEntrar" type="submit" style="width:100%;padding:12px;font-size:15px;margin-top:14px">Entrar</button>
    </form>
    <div id="logErr" class="mini" style="color:var(--bad);margin-top:10px"></div>
    <div style="margin-top:18px;border-top:1px solid var(--line);padding-top:12px"><button class="btn sm" id="btnLogin" style="width:100%">Entrar com Google (administrador)</button></div>
  </div>
</div>
<div class="wrap">
  <header>
    <div>
      <h1>Agenda de Consultas</h1>
      <div class="sub" id="sub">Carregando…</div>
    </div>
    <div class="row" style="gap:6px"><button class="btn sm" id="btnTema" title="Modo claro/noturno" aria-label="Alternar modo noturno"></button><button class="btn sm" id="btnBuscar" title="Buscar paciente">🔎 Buscar</button></div>
  </header>
  <div id="banner"></div>
  <div class="seg" id="profSeg">
    <button data-p="ednaldo" class="on">Ednaldo</button>
    <button data-p="elaine">Elaine</button>
  </div>
  <div id="view"></div>
</div>

<nav class="tabs"><div class="in2">
  <button data-t="agenda" class="on"><span class="e">📅</span>Agenda</button>
  <button data-t="remarcar"><span class="e">⚠️</span>Remarcar<span class="badge hidden" id="badge"></span></button>
  <button data-t="avisar"><span class="e">📲</span>Avisar<span class="badge hidden" id="badge2"></span></button>
  <button data-t="bloqueios"><span class="e">🔒</span>Bloqueios</button>
  <button data-t="lembretes"><span class="e">📝</span>Lembretes<span class="badge hidden" id="badge3"></span></button>
  <button data-t="mural"><span class="e">💬</span>Mural<span class="badge hidden" id="badge4"></span></button>
  <button data-t="ajustes"><span class="e">⚙️</span>Ajustes</button>
</div></nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
/* ===================== Constantes ===================== */
const ADMIN_EMAIL = 'gabrielson3006@gmail.com';
const isAdmin = () => !!(S.user && (S.user.email||'').toLowerCase()===ADMIN_EMAIL);
const AVISO_ADMIN = '<div class="banner" style="background:var(--pbg);color:var(--ink)">🔐 Só o Gabriel (administrador) pode alterar isto. Você vê tudo normalmente.</div>';
const PROFS = { ednaldo:{nome:'Ednaldo',pron:'ele'}, elaine:{nome:'Elaine',pron:'ela'} };
const TURNOS = { M:'Manhã', T:'Tarde' };
const DIAS = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const DIAS_L = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const DEFAULT_VAGAS = {
  ednaldo:{1:{M:3,T:3},2:{M:3,T:3},3:{M:0,T:3},4:{M:0,T:0},5:{M:0,T:0}},
  elaine: {1:{M:0,T:0},2:{M:3,T:3},3:{M:0,T:0},4:{M:3,T:3},5:{M:3,T:3}}
};
const MOTIVOS = ['Férias','Reunião','Capacitação','Atestado','Folga','Visita domiciliar','Ponto facultativo','Licença'];

/* ===================== Utilidades de data ===================== */
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const todayIso = () => iso(new Date());
const fmtCurto = s => { const d=parse(s); return DIAS[d.getDay()]+' '+pad(d.getDate())+'/'+pad(d.getMonth()+1); };
const fmtLongo = s => { const d=parse(s); return DIAS_L[d.getDay()]+', '+pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear(); };
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MINUSC = new Set(['da','de','do','das','dos','e','di','du','del','van','von']);
function nomeProprio(s){
  return String(s||'').trim().replace(/\s+/g,' ').toLocaleLowerCase('pt-BR').split(' ')
    .map((w,i)=> i>0 && MINUSC.has(w) ? w : w.split(/([-'’])/).map(p=>p?p.charAt(0).toLocaleUpperCase('pt-BR')+p.slice(1):p).join(''))
    .join(' ');
}
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);

/* ===================== Feriados ===================== */
function pascoa(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da);}
function feriadosDoAno(y){
  const p=pascoa(y), L=[];
  const f=(k,d,n,obs)=>L.push({key:k,data:iso(d),nome:n,obs});
  f('confra',new Date(y,0,1),'Confraternização Universal');
  f('carn-seg',addDays(p,-48),'Carnaval (segunda)','ponto facultativo');
  f('carn-ter',addDays(p,-47),'Carnaval (terça)');
  f('cinzas',addDays(p,-46),'Quarta de Cinzas','facultativo até 14h — desligado por padrão');
  f('sexta-santa',addDays(p,-2),'Sexta-feira Santa');
  f('tiradentes',new Date(y,3,21),'Tiradentes');
  f('sao-jorge',new Date(y,3,23),'São Jorge (RJ)');
  f('trabalho',new Date(y,4,1),'Dia do Trabalho');
  f('corpus',addDays(p,60),'Corpus Christi');
  f('santo-antonio',new Date(y,5,13),'Santo Antônio (Caxias)','conferir decreto municipal');
  f('patrono',new Date(y,7,25),'Duque de Caxias — patrono','conferir decreto municipal');
  f('independencia',new Date(y,8,7),'Independência');
  f('aparecida',new Date(y,9,12),'N. Sra. Aparecida');
  f('servidor',new Date(y,9,28),'Dia do Servidor Público','ponto facultativo — desligado por padrão');
  f('finados',new Date(y,10,2),'Finados');
  f('republica',new Date(y,10,15),'Proclamação da República');
  f('consciencia',new Date(y,10,20),'Consciência Negra');
  f('natal',new Date(y,11,25),'Natal');
  f('aniv-caxias',new Date(y,11,31),'Aniversário de Duque de Caxias');
  return L;
}
const FERIADO_OFF_PADRAO = ['cinzas','servidor'];
const ferCache = {};
function feriadoEm(s){
  const y=+s.slice(0,4);
  if(!ferCache[y]){ ferCache[y]={}; feriadosDoAno(y).forEach(h=>ferCache[y][h.data]=h); }
  const h=ferCache[y][s];
  if(!h) return null;
  const off = S.cfg.feriadosOff ?? FERIADO_OFF_PADRAO;
  return off.includes(h.key) ? null : h;
}

/* ===================== Estado ===================== */
const S = {
  ag:[], bl:[], lot:[], ext:[], lem:[], todo:[], notas:[], cfg:{ vagas:JSON.parse(JSON.stringify(DEFAULT_VAGAS)), feriadosOff:null },
  prof:'ednaldo', tab:'agenda', mes:null, mover:null, sheetDia:null, modo:'carregando'
};
{ const t=new Date(); S.mes=new Date(t.getFullYear(),t.getMonth(),1); }
try{ const p=localStorage.getItem('agenda-prof'); if(p&&PROFS[p]) S.prof=p; }catch(e){}

/* ===================== Regras ===================== */
const extraDia=(prof,s,t)=>S.ext.find(x=>x.prof===prof&&x.data===s&&x.turno===t)||null;
function vagas(prof,s,t){
  const ex=extraDia(prof,s,t); if(ex) return +ex.vagas||0;
  const wd=parse(s).getDay(); if(wd===0||wd===6) return 0;
  const v=(S.cfg.vagas?.[prof]?.[wd]) || DEFAULT_VAGAS[prof][wd] || {M:0,T:0};
  return +v[t]||0;
}
function bloqueio(prof,s,t){
  const h=feriadoEm(s); if(h) return {motivo:'Feriado: '+h.nome, feriado:true};
  return S.bl.find(b => (b.prof===prof||b.prof==='ambos') && s>=b.inicio && s<=b.fim && (b.turno==='MT'||b.turno===t)) || null;
}
const doTurno = (prof,s,t) => S.ag.filter(a=>a.prof===prof&&a.data===s&&a.turno===t).sort((a,b)=>(a.criadoEm||0)-(b.criadoEm||0));
const lotado=(prof,s,t)=>S.lot.find(x=>x.prof===prof&&x.data===s&&x.turno===t)||null;
const meuPid=()=>S.user&&S.user.pid;
function equipeN(prof,s,t){ const k=prof+'|'+s+'|'+t; let n=doTurno(prof,s,t).length; for(const o of (S.ocup||[])){ if(o.id===meuPid()) continue; n+=((o.counts||{})[k]||0); } return n; }
function equipeDetalhe(prof,s,t){
  const k=prof+'|'+s+'|'+t, cap=vagas(prof,s,t), out=[];
  const meu=doTurno(prof,s,t).length; if(meu) out.push({nome:S.cfg.acsNome||'Você',n:meu,eu:true});
  for(const o of (S.ocup||[])){ if(o.id===meuPid()) continue; const n=(o.counts||{})[k]||0; if(n) out.push({nome:o.nome||o.id,n}); }
  return out.sort((a,b)=>b.n-a.n||a.nome.localeCompare(b.nome)).map(x=>({...x,extra:Math.max(0,x.n-cap)}));
}
const equipeCap=(prof,s,t)=>vagas(prof,s,t)*(+S.cfg.nAcs||4);
function estado(prof,s,t){
  const cap=vagas(prof,s,t); if(!cap){ const n0=doTurno(prof,s,t).length; return n0?{tipo:'over',cap:0,n:n0}:{tipo:'none',cap:0,n:0}; }
  const n=doTurno(prof,s,t).length, bl=bloqueio(prof,s,t);
  if(bl) return {tipo:'lock',cap,n,bl};
  let lt=lotado(prof,s,t);
  if(!lt){ const tn=equipeN(prof,s,t), tc=equipeCap(prof,s,t); if(tc>0 && tn>=tc) lt={auto:true,n:tn,cap:tc}; }
  if(lt) return {tipo: n>cap?'over':'full', cap, n, lot:lt};
  return {tipo: n>cap?'over': n===cap?'full':'free', cap, n};
}
function proximasVagas(prof,qtd=8,excluir=null,occ={}){
  const out=[]; let d=new Date(); d.setHours(0,0,0,0);
  for(let i=0;i<180&&out.length<qtd;i++,d=addDays(d,1)){
    const s=iso(d);
    for(const t of ['M','T']){
      if(excluir && excluir.data===s && excluir.turno===t) continue;
      const e=estado(prof,s,t);
      const livres=e.cap-e.n-(occ[prof+'|'+s+'|'+t]||0);
      if(e.tipo==='free' && livres>0) out.push({data:s,turno:t,livres});
      if(out.length>=qtd) break;
    }
  }
  return out;
}
function opcoesRemarcar(prof,qtd,excluir,soLotados){
  const out=[]; let d=new Date(); d.setHours(0,0,0,0);
  for(let i=0;i<180&&out.length<qtd;i++,d=addDays(d,1)){
    const s=iso(d);
    for(const t of ['M','T']){
      if(excluir && excluir.data===s && excluir.turno===t) continue;
      const e=estado(prof,s,t);
      if(e.cap>0 && e.tipo!=='lock' && (soLotados ? !!e.lot : !e.lot)) out.push({data:s,turno:t,livres:e.cap-e.n,n:e.n,cap:e.cap,lot:e.lot});
      if(out.length>=qtd) break;
    }
  }
  return out;
}
function ehExtra(a){ const cap=vagas(a.prof,a.data,a.turno); const L=doTurno(a.prof,a.data,a.turno); const i=L.findIndex(x=>x.id===a.id); return i>=cap; }
function aRemarcar(){
  const hoje=todayIso();
  return S.ag.filter(a=>a.data>=hoje && bloqueio(a.prof,a.data,a.turno)).sort((a,b)=>a.data.localeCompare(b.data)||a.turno.localeCompare(b.turno));
}

let UNSUBS=[];
let ocupUltimo='', ocupT=null;
function agendarSyncOcup(){ clearTimeout(ocupT); ocupT=setTimeout(syncOcup,1500); }
async function syncOcup(){
  if(!DB||!meuPid()||S.modo==='semacesso') return;
  const hoje=todayIso(), counts={};
  for(const a of S.ag){ if(a.data>=hoje){ const k=a.prof+'|'+a.data+'|'+a.turno; counts[k]=(counts[k]||0)+1; } }
  const js=JSON.stringify(counts); if(js===ocupUltimo) return; ocupUltimo=js;
  try{ await DB.collection('ocupacao').doc(meuPid()).set({nome:S.cfg.acsNome||'',counts,atualizadoEm:Date.now()}); }catch(e){ ocupUltimo=''; }
}
function iniciar(){ render(); }
function desconectar(){ UNSUBS.forEach(u=>{ try{u()}catch(e){} }); UNSUBS=[]; DB=null; S.ag=[];S.bl=[];S.lot=[];S.ext=[];S.lem=[];S.todo=[];S.notas=[];S.ocup=[];S.mural=[];S.muralLido=0;S.vistoBl=null; }
function conectar(db, usuario){
  desconectar(); DB=db; S.user=usuario; S.modo='carregando'; render();
  const nomes=['notas','afazeres','lembretes','extras','lotados','agendamentos','bloqueios'];
  const chave={notas:'notas',afazeres:'todo',lembretes:'lem',extras:'ext',lotados:'lot',agendamentos:'ag',bloqueios:'bl'};
  let pend=nomes.length+2; const vistos={};
  const pronto=k=>{ if(vistos[k]) return; vistos[k]=true; if(--pend===0){ clearTimeout(tm); if(S.modo==='carregando'||S.modo==='lento') S.modo='nuvem'; } };
  const tm=setTimeout(()=>{ if(S.modo==='carregando'){ S.modo='lento'; render(); } },10000);
  const fail=e=>{ clearTimeout(tm); S.modo = e&&e.code==='permission-denied' ? 'semacesso' : e&&e.code==='resource-exhausted' ? 'cota' : 'erro'; render(); };
  const corte=iso(addDays(new Date(),-60));
  for(const n of nomes){
    const q = n==='agendamentos' ? db.collection(n).where('data','>=',corte) : db.collection(n);
    UNSUBS.push(q.onSnapshot(snap=>{ S[chave[n]]=snap.docs.map(d=>({id:d.id,...d.data()})); if(!snap.metadata.fromCache){ pronto(n); if(n==='agendamentos') agendarSyncOcup(); } render(); }, fail));
  }
  ocupUltimo='';
  UNSUBS.push(db.collection('ocupacao').onSnapshot(snap=>{ S.ocup=snap.docs.map(d=>({id:d.id,...d.data()})); render(); }, ()=>{}));
  UNSUBS.push(db.collection('mural').where('criadoEm','>=',Date.now()-120*864e5).onSnapshot(snap=>{ S.mural=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.criadoEm-b.criadoEm); render(); }, ()=>{}));
  UNSUBS.push(db.doc('config/equipe').onSnapshot(snap=>{ if(snap.exists){ const c=snap.data(); S.cfg.vagas=JSON.parse(JSON.stringify(c.vagas||DEFAULT_VAGAS)); S.cfg.feriadosOff=c.feriadosOff?[...c.feriadosOff]:null; S.cfg.nAcs=c.nAcs||4; } if(!snap.metadata.fromCache) pronto('cfg'); render(); }, fail));
  UNSUBS.push(db.doc('perfil').onSnapshot(snap=>{ const c=snap.exists?snap.data():{};
    if(!snap.metadata.fromCache){ if(c.vistoBl==null){ c.vistoBl=Date.now(); db.doc('perfil').merge({vistoBl:c.vistoBl}).catch(()=>{}); } }
    S.vistoBl=c.vistoBl||Date.now(); S.muralLido=Math.max(S.muralLido||0, c.muralLido||0);
    S.cfg.msgModelo=c.msgModelo||null; S.cfg.acsNome=c.acsNome||((usuario&&usuario.displayName)||'').split(' ')[0]||''; if(!snap.metadata.fromCache) pronto('perfil'); render(); }, fail));
}

const sheet=$('#sheet'), scrim=$('#scrim');

scrim.onclick=fecharSheet;
const rascunho={};
function abrirDia(s,refresh){
  if(refresh && !sheet.classList.contains('on')) return;
  // preservar o que está digitado
  sheet.querySelectorAll('[data-draft]').forEach(i=>rascunho[i.dataset.draft]=i.value);
  if(S.lemNome && !refresh){ ['M','T'].forEach(t=>{ if(!rascunho[s+t+'n']) rascunho[s+t+'n']=S.lemNome; if(S.lemObs && !rascunho[s+t+'o']) rascunho[s+t+'o']=S.lemObs; }); }
  S.sheetDia=s; const P=S.prof; const mov=S.mover?S.ag.find(x=>x.id===S.mover):null;
  let h=`<div class="grab"></div><div class="row between"><div><h2>${fmtLongo(s)}</h2><div class="mini">${PROFS[P].nome}</div></div><button class="icon" data-act="fechar">✕</button></div>`;
  const lemDia=S.lem.filter(l=>l.prof===P&&l.data===s);
  if(lemDia.length && !mov) h+=`<div class="banner" style="margin-top:10px;background:var(--pbg);color:var(--ink)"><b>📝 Lembretes deste dia</b>${lemDia.map(l=>`<div class="row between" style="margin-top:6px"><span><b>${esc(l.nome)}</b>${l.turno?' · '+TURNOS[l.turno].toLowerCase():''}${l.obs?'<br><span class="mini">'+esc(l.obs)+'</span>':''}</span><button class="btn sm p" data-act="lem-agendar" data-id="${l.id}">Agendar</button></div>`).join('')}</div>`;
  if(mov) h+=`<div class="mover" style="margin-top:10px"><span>Movendo <b>${esc(mov.nome)}</b></span><button data-act="cancel-mover">Cancelar</button></div>`;
  let algum=false; const semVaga=[];
  for(const t of ['M','T']){
    const cap=vagas(P,s,t); if(!cap && !doTurno(P,s,t).length){ semVaga.push(t); continue; } algum=true;
    const ex=extraDia(P,s,t);
    const e=estado(P,s,t), L=doTurno(P,s,t), bl=e.bl;
    const passado = s<todayIso();
    h+=`<div class="turno ${bl?'lock':''}"><div class="hd"><b>${TURNOS[t]}${ex?' <span class="tag x">atend. extra</span>':''}</b><span class="pill s-${e.tipo}">${e.lot?'📌 lotada · ':''}${e.n}/${cap}${e.n>cap?' (+'+(e.n-cap)+' extra)':''}</span></div>`;
    if(!bl && cap){ const det=equipeDetalhe(P,s,t);
      h+=`<div class="mini" style="margin:-2px 0 6px">👥 Equipe: <b>${equipeN(P,s,t)}/${equipeCap(P,s,t)}</b> vagas usadas${det.length?`<div class="equipe">${det.map(x=>`<span class="eqp ${x.eu?'eu':''} ${x.extra?'ext':''}">${esc(x.nome)} <b>${x.n}</b>${x.extra?` <small>(+${x.extra} extra)</small>`:''}</span>`).join('')}</div>`:''}</div>`; }
    if(!bl && e.lot) h+= e.lot.auto ? `<div class="lockmsg" style="color:var(--warn)">📌 Agenda da equipe cheia (${e.lot.n}/${e.lot.cap})</div><div class="mini" style="margin:2px 0 6px">Calculado automaticamente com as agendas de todos. Não entra nas sugestões de vaga.</div>`
      : `<div class="lockmsg" style="color:var(--warn)">📌 Agenda lotada${e.lot.obs?' — '+esc(e.lot.obs):''}</div><div class="mini" style="margin:2px 0 6px">Marcado à mão. Não entra nas sugestões de vaga.</div>`;
    if(bl) h+=`<div class="lockmsg">🔒 ${esc(bl.motivo)}</div>${bl.feriado?'':`<div class="mini" style="margin:2px 0 6px">Bloqueio de ${bl.inicio===bl.fim?fmtCurto(bl.inicio):fmtCurto(bl.inicio)+' a '+fmtCurto(bl.fim)}</div>`}`;
    h+= L.length ? `<div class="list">${L.map((a,i)=>`<div class="item"><div class="t"><b>${i+1}. ${esc(a.nome)}</b>${a.remarcadoDe?`<small>remarcado de ${fmtCurto(a.remarcadoDe)}</small>`:''}${a.obs?`<div class="nota">📝 ${esc(a.obs)}</div>`:''}</div>${ehExtra(a)?'<span class="tag x">extra</span>':''}<button class="btn sm" data-act="editar" data-id="${a.id}">✎</button><button class="btn sm" data-act="remarcar" data-id="${a.id}">Remarcar</button></div>`).join('')}</div>` : (bl?'':'<div class="empty">Nenhum paciente.</div>');
    if(mov){
      const mesmo = mov.data===s&&mov.turno===t&&mov.prof===P;
      if(!bl && !mesmo && !passado) h+=`<button class="btn p" style="width:100%;margin-top:8px" data-act="mover-aqui" data-d="${s}" data-t="${t}">${e.n>=cap?'Mover para cá como extra':'Mover '+esc(mov.nome)+' para cá'}</button>`;
    } else if(!bl && !passado){
      const k=s+t;
      h+=`<div class="addrow"><input class="in" placeholder="Nome do paciente" data-draft="${k}n" value="${esc(rascunho[k+'n']||'')}"><button class="btn p" data-act="add" data-d="${s}" data-t="${t}">${e.n>=cap?'+ Extra':'+'}</button></div>
      <textarea class="in" rows="2" style="margin-top:6px;padding:8px;resize:vertical" placeholder="📝 Nota: motivo do agendamento (opcional)" data-draft="${k}o">${esc(rascunho[k+'o']||'')}</textarea>
      ${e.n>=cap?'<div class="mini" style="margin-top:4px">Suas vagas estão cheias — vai entrar como <b>extra (urgência)</b>.</div>':e.lot?'<div class="mini" style="margin-top:4px">📌 Agenda da equipe lotada. Pode lançar normalmente os pacientes que já estavam nas suas vagas.</div>':''}`;
    } else if(bl && !passado){
      const kb=s+t+'b';
      h+=`<div class="mini" style="margin-top:6px">Não dá para agendar neste turno. Se algum paciente <b>já estava marcado</b> antes do bloqueio, registre aqui — ele vai direto para remarcar:</div>

    }
    if(!bl && !passado && !mov && !(e.lot&&e.lot.auto)) h+= e.lot ? `<button class="btn sm" style="margin-top:8px" data-act="del-lot" data-id="${e.lot.id}">Desfazer “lotada”</button>` : `<button class="btn sm" style="margin-top:8px" data-act="lotar" data-d="${s}" data-t="${t}">📌 Marcar ${TURNOS[t].toLowerCase()} como lotada</button>`;
    if(ex && !L.length && !passado && !mov) h+=`<button class="btn sm d" style="margin-top:8px;margin-left:6px" data-act="del-ext" data-id="${ex.id}">Fechar atendimento extra</button>`;
    h+=`</div>`;
  }
  const podeAbrir = !mov && s>=todayIso() && semVaga.length && !feriadoEm(s);
  const botoesExtra = podeAbrir ? `<div class="row" style="gap:6px;flex-wrap:wrap;margin-top:8px">${semVaga.map(t=>`<button class="btn sm" data-act="abrir-ext" data-d="${s}" data-t="${t}">➕ Abrir ${TURNOS[t].toLowerCase()} extra</button>`).join('')}</div><div class="mini" style="margin-top:4px">Use quando ${PROFS[P].nome} for atender fora do dia normal (ex.: compensar recesso).</div>` : '';
  if(!algum){ const f=feriadoEm(s); h+=`<div class="turno"><div class="empty">${PROFS[P].nome} não atende neste dia${f?' (feriado: '+esc(f.nome)+')':''}.</div>${botoesExtra}</div>`; }
  else { if(botoesExtra) h+=`<div class="turno">${botoesExtra}</div>`; }
  if(algum && !mov && s>=todayIso() && isAdmin()) h+=`<div style="margin-top:12px"><button class="btn" style="width:100%" data-act="bloquear-dia" data-d="${s}">🔒 Bloquear este dia/turno…</button></div>`;
  sheet.innerHTML=h;
  if(!refresh){ sheet.classList.add('on'); scrim.classList.add('on'); sheet.scrollTop=0; }
}

/* ===================== Backup ===================== */
const COLS={ag:'agendamentos',bl:'bloqueios',lot:'lotados',ext:'extras',lem:'lembretes',todo:'afazeres',notas:'notas'};
function exportarBackup(){
  const o={versao:1,exportadoEm:new Date().toISOString(),cfg:S.cfg}; for(const k in COLS) o[k]=S[k];
  const blob=new Blob([JSON.stringify(o,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='agenda-backup-'+todayIso()+'.json'; document.body.appendChild(a); a.click(); a.remove();
  toast('Backup baixado. Guarde o arquivo (ex.: mande para você mesmo no WhatsApp).');
}
async function importarBackup(file){
  if(!DB){ toast('Entre na sua conta primeiro.'); return; }
  let j; try{ j=JSON.parse(await file.text()); }catch(e){ toast('Arquivo inválido.'); return; }
  let n=0;
  try{
    for(const k in COLS){ if(!isAdmin() && k==='bl') continue; for(const item of (j[k]||[])){ const {id,...b}=item; if(!id) continue; await DB.collection(COLS[k]).doc(id).set(b); n++; } }
    if(j.cfg){ if(j.cfg.vagas && isAdmin()) S.cfg.vagas=j.cfg.vagas; if('feriadosOff' in j.cfg && isAdmin()) S.cfg.feriadosOff=j.cfg.feriadosOff; if(j.cfg.msgModelo) S.cfg.msgModelo=j.cfg.msgModelo; if(j.cfg.acsNome) S.cfg.acsNome=j.cfg.acsNome; await Store.saveCfg(); }
    toast(`✓ Backup importado: ${n} registros.`,6000);
  }catch(e){ erroDb(e); }
}

        const a=S.ag.find(x=>x.id===p.id); if(!a) continue;
        await Store.updAg(p.id,{data:p.para,turno:p.paraT,extra:false,remarcadoDe:p.de,remarcadoDeT:p.deT,motivoRem:p.motivo,avisado:false});
      }
      S.tab='avisar'; render(); window.scrollTo({top:0}); toast(`✓ ${ok.length} paciente(s) remarcado(s). Agora é só avisar. ${botaoDesfazer(async()=>{ for(const [id,v] of antesT) await Store.updAg(id,v); })}`,10000);
      break; }
    case 'copiar-msg': abrirCopiarMsg(d.id); break;
    case 'hora-chip': { const i=$('#hrIn'); i.value=d.v; i.oninput(); break; }
    case 'copiar-msg-ok': {
      const a=S.ag.find(x=>x.id===d.id); if(!a) return;
      const h=$('#hrIn').value.trim();
      const txt=msgPaciente({...a,horario:h});
      let ok=true; try{ await navigator.clipboard.writeText(txt); }catch(e){ ok=false; }
      if(h!==(a.horario||'')) await Store.updAg(a.id,{horario:h});
      if(ok){ fecharSheet(); toast('Mensagem copiada — cole no WhatsApp do paciente.'); }
      else { const t=$('#hrPrev'); const range=document.createRange(); range.selectNodeContents(t); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(range); toast('Não consegui copiar sozinho — o texto está selecionado, copie manualmente.'); }
      break; }
    case 'avisado': { const a=S.ag.find(x=>x.id===d.id); await Store.updAg(d.id,{avisado:true}); toast(`✓ ${esc(a?a.nome:'Paciente')} marcado(a) como avisado. <button class="undo" data-act="desfazer-avisado" data-id="${d.id}">Desfazer</button>`,8000); break; }
    case 'corrigir-nomes': {
      const L=S.ag.filter(a=>nomeProprio(a.nome)!==a.nome);
      if(!L.length){ toast('Todos os nomes já estão no formato certo.'); return; }
      for(const a of L) await Store.updAg(a.id,{nome:nomeProprio(a.nome)});
      toast(`✓ ${L.length} nome(s) corrigido(s).`); break; }
    case 'marcar-remarcado': {
      const de=$('#edDe').value, deT=$('#edDeT').value, mot=$('#edMot').value.trim();
      if(!de){ toast('Informe a data antiga.'); return; }
      await Store.updAg(d.id,{remarcadoDe:de,remarcadoDeT:deT||'',motivoRem:mot,avisado:false});
      fecharSheet(); toast('✓ Enviado para a aba Avisar.'); break; }
    case 'limpar-remarcado': await Store.updAg(d.id,{remarcadoDe:null,remarcadoDeT:null,motivoRem:null,avisado:null}); fecharSheet(); toast('Removido da lista de remarcados.'); break;
    case 'abrir-ext': await Store.addExt({prof:S.prof,data:d.d,turno:d.t,vagas:3}); toast(`➕ ${TURNOS[d.t]} extra aberta — 3 vagas.`); break;
    case 'del-ext': await Store.delExt(d.id); toast('Atendimento extra fechado.'); break;
    case 'editar-msg': S.tab='ajustes'; render(); setTimeout(()=>{ const c=$('#cardMsg'); c&&c.scrollIntoView({behavior:'smooth'}); },50); break;
    case 'ins-campo': {
      const ta=$('#msgModelo'); const tag='{'+d.k+'}';
      const a0=ta.selectionStart??ta.value.length, b0=ta.selectionEnd??a0;
      ta.value=ta.value.slice(0,a0)+tag+ta.value.slice(b0); ta.focus(); ta.setSelectionRange(a0+tag.length,a0+tag.length); ta.oninput(); break; }
    case 'salvar-msg': { const v=$('#msgModelo').value.trim(); if(!v){ toast('A mensagem está vazia.'); return; } S.cfg.msgModelo=(v===MSG_PADRAO?null:v); S.cfg.acsNome=nomeProprio($('#acsNome').value); await Store.saveCfg(); toast('✓ Mensagem salva. Vale para todos os avisos.'); break; }
    case 'msg-padrao': S.cfg.msgModelo=null; await Store.saveCfg(); toast('Mensagem padrão restaurada.'); break;
    case 'undo': { const fn=UNDO[d.k]; if(!fn) return; delete UNDO[d.k]; $('#toast').classList.remove('on'); await fn(); toast('↩️ Desfeito.'); break; }
    case 'desfazer-avisado': { const ids=d.id.split(','); for(const id of ids) await Store.updAg(id,{avisado:false}); $('#toast').classList.remove('on'); toast(ids.length>1?`↩️ ${ids.length} pacientes voltaram para a lista.`:'↩️ Voltou para a lista de avisar.'); break; }
    case 'ver-avisados': verAvisados=!verAvisados; rAvisar(); break;
    case 'avisado-grupo': case 'copiar-grupo': {
      const gr=gruposAvisar(paraAvisar()).find(g=>g.prof+'|'+g.de+'|'+(g.deT||'')===d.k); if(!gr) return;
      if(act==='avisado-grupo'){
        if(el.dataset.ok!=='1'){ el.dataset.ok='1'; el.textContent='Confirmar todos'; el.classList.add('p'); return; }
        for(const a of gr.itens) await Store.updAg(a.id,{avisado:true});
        toast(`✓ ${gr.itens.length} marcados como avisados. <button class="undo" data-act="desfazer-avisado" data-id="${gr.itens.map(a=>a.id).join(',')}">Desfazer</button>`,8000); return;
      }
      const txt=`*Remarcados — ${PROFS[gr.prof].nome}, ${fmtCurto(gr.de)}${gr.deT?' '+TURNOS[gr.deT].toLowerCase():''}*${gr.motivo?' ('+gr.motivo+')':''}\n`+gr.itens.map(a=>`• ${a.nome} → ${fmtCurto(a.data)} ${TURNOS[a.turno].toLowerCase()}`).join('\n');
      try{ await navigator.clipboard.writeText(txt); toast('Lista copiada.'); }catch(e){ toast('Não consegui copiar neste aparelho.'); }
      break; }
    case 'copiar-avisos': {
      const hoje=todayIso();
      const L=S.ag.filter(a=>a.remarcadoDe&&a.avisado===false&&a.data>=hoje).sort((a,b)=>a.data.localeCompare(b.data)||a.turno.localeCompare(b.turno));
      const txt='*Pacientes remarcados*\n'+L.map(a=>`• ${a.nome} (${PROFS[a.prof].nome}): ${fmtCurto(a.remarcadoDe)}${a.remarcadoDeT?' '+TURNOS[a.remarcadoDeT].toLowerCase():''} → ${fmtCurto(a.data)} ${TURNOS[a.turno].toLowerCase()}`).join('\n');
      try{ await navigator.clipboard.writeText(txt); toast('Resumo copiado.'); }catch(e){ toast('Não consegui copiar neste aparelho.'); }
      break; }
    case 'lotar': {
      if(lotado(S.prof,d.d,d.t)) return;
      await Store.addLot({prof:S.prof,data:d.d,turno:d.t,obs:''});
      toast(`📌 ${fmtCurto(d.d)} ${TURNOS[d.t].toLowerCase()} marcada como lotada.`); break; }
    case 'del-lot': await Store.delLot(d.id); toast('Turno liberado de novo.'); break;
    case 'motivo': blForm.motivo=d.v; rBloqueios(); break;
    case 'salvar-bl': {
      const motivo=($('#blMot').value||'').trim();
      if(!motivo){ toast('Escreva ou escolha o motivo.'); return; }
      if(!blForm.inicio||!blForm.fim||blForm.fim<blForm.inicio){ toast('Confira as datas.'); return; }
      await Store.addBl({prof:blForm.prof,inicio:blForm.inicio,fim:blForm.fim,turno:blForm.turno,motivo});
      const n=aRemarcar().length; blForm.motivo='';
      toast('🔒 Bloqueio salvo.'+(n?` ${n} paciente(s) para remarcar.`:''));
      break; }
    case 'del-bl': {
      if(el.dataset.ok!=='1'){ el.dataset.ok='1'; el.textContent='Confirmar'; return; }
      await Store.delBl(d.id); toast('Bloqueio removido.'); break; }
    case 'bloquear-dia': blForm={prof:S.prof,inicio:d.d,fim:d.d,turno:'MT',motivo:''}; fecharSheet(); S.tab='bloqueios'; render(); window.scrollTo({top:0}); break;
    case 'salvar-vagas': {
      const P=S.prof, v={}; document.querySelectorAll('.vgrid input').forEach(i=>{ const w=i.dataset.w; v[w]=v[w]||{}; v[w][i.dataset.t]=Math.max(0,Math.min(20,parseInt(i.value)||0)); });
      S.cfg.vagas={...S.cfg.vagas,[P]:v}; const na=$('#nAcs'); if(na) S.cfg.nAcs=Math.max(1,Math.min(10,parseInt(na.value)||4)); await Store.saveCfg(); toast('Vagas salvas.'); break; }
    case 'reset-vagas': S.cfg.vagas={...S.cfg.vagas,[S.prof]:JSON.parse(JSON.stringify(DEFAULT_VAGAS[S.prof]))}; await Store.saveCfg(); toast('Padrão restaurado.'); break;
    case 'copiar': {
      const hoje=todayIso();
      const txt=['ednaldo','elaine'].map(p=>{ const L=S.ag.filter(a=>a.prof===p&&a.data>=hoje).sort((a,b)=>a.data.localeCompare(b.data)||a.turno.localeCompare(b.turno));
        return `*${PROFS[p].nome}*\n`+(L.length?L.map(a=>`${fmtCurto(a.data)} ${TURNOS[a.turno]} — ${a.nome}${a.obs?' ('+a.obs+')':''}`).join('\n'):'(nenhum)'); }).join('\n\n');
      try{ await navigator.clipboard.writeText(txt); toast('Lista copiada — é só colar no WhatsApp.'); }catch(e){ toast('Não consegui copiar neste aparelho.'); }
      break; }
  }
});

const UNDO={};
const CAMPOS_MOV=['data','turno','extra','remarcadoDe','remarcadoDeT','motivoRem','avisado'];
function snapMov(a){ const o={}; CAMPOS_MOV.forEach(k=>o[k]= a[k]===undefined ? null : a[k]); return o; }
function botaoDesfazer(fn){ const k=uid(); UNDO[k]=fn; return `<button class="undo" data-act="undo" data-k="${k}">Desfazer</button>`; }
async function moverPara(id,s,t){
  const a=S.ag.find(x=>x.id===id); if(!a) return;
  if(bloqueio(a.prof,s,t)){ toast('Esse turno está bloqueado.'); return; }
  const e=estado(a.prof,s,t);
  const de=a.data, deT=a.turno;
  const motivoRem=(bloqueio(a.prof,de,deT)||{}).motivo||'';
  const antes=snapMov(a);
  await Store.updAg(id,{data:s,turno:t,extra:e.n>=e.cap,remarcadoDe:de,remarcadoDeT:deT,motivoRem,avisado:false});
  S.mover=null; fecharSheet(); render();
  toast(`✓ ${esc(a.nome)}: ${fmtCurto(de)} ${deT} → <b>${fmtCurto(s)} · ${TURNOS[t]}</b><br>Ele(a) está na aba Avisar. ${botaoDesfazer(()=>Store.updAg(id,antes))}`,9000);
}

document.querySelectorAll('#profSeg button').forEach(b=>b.onclick=()=>{ S.prof=b.dataset.p; try{localStorage.setItem('agenda-prof',S.prof);}catch(e){} fecharSheet(); render(); });
function pintarTema(){ const e=document.documentElement.dataset.tema==='escuro'; const b=$('#btnTema'); b.textContent=e?'☀️':'🌙'; b.title=e?'Modo claro':'Modo noturno'; }
$('#btnTema').onclick=()=>{ const n=document.documentElement.dataset.tema==='escuro'?'claro':'escuro'; document.documentElement.dataset.tema=n; try{localStorage.setItem('agenda-tema',n)}catch(e){} pintarTema(); };
pintarTema();
$('#btnBuscar').onclick=()=>{ S.tab='buscar'; fecharSheet(); render(); window.scrollTo({top:0}); setTimeout(()=>{ const q=$('#q'); q&&q.focus(); },50); };
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{ S.tab=b.dataset.t; fecharSheet(); render(); window.scrollTo({top:0}); });
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.matches('[data-draft$="n"]')){ const k=e.target.dataset.draft.slice(0,-1); const b=sheet.querySelector(`[data-act="add"][data-d="${k.slice(0,10)}"][data-t="${k.slice(10)}"]`); b&&b.click(); } if(e.key==='Escape') fecharSheet(); });

function corrigirCampo(el){ if(el && el.matches('[data-draft$="n"],[data-draft$="b"],#edNome,#lemNome,#leNome')){ const v=nomeProprio(el.value); if(v!==el.value.trim()) el.value=v; } }
document.addEventListener('paste',e=>{ const el=e.target; setTimeout(()=>corrigirCampo(el),0); });
document.addEventListener('focusout',e=>corrigirCampo(e.target));
const OLHO_ABERTO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const OLHO_FECHADO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-6.5 0-10-7-10-7a18.5 18.5 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
function pintarOlhos(root){ (root||document).querySelectorAll('[data-olho]').forEach(b=>{ if(!b.innerHTML) b.innerHTML=OLHO_ABERTO; }); }
document.addEventListener('click',e=>{ const b=e.target.closest('[data-olho]'); if(!b) return; e.preventDefault(); e.stopPropagation();
  const i=b.parentElement.querySelector('input'); const mostrar=i.type==='password'; i.type=mostrar?'text':'password';
  b.innerHTML=mostrar?OLHO_FECHADO:OLHO_ABERTO; b.title=b.ariaLabel=mostrar?'Ocultar senha':'Mostrar senha'; i.focus(); },true);
new MutationObserver(()=>pintarOlhos()).observe(document.body,{childList:true,subtree:true});
pintarOlhos();
iniciar();
</script>

<script type="module">
/* ============ CONFIGURAÇÃO DO FIREBASE ============
   Cole aqui o objeto firebaseConfig que o Firebase mostra em
   Configurações do projeto → Seus apps → App da Web.           */
const firebaseConfig = {
  apiKey: "AIzaSyD-eGvEVAexpOR7PBK-78GxLFPfkV0g43I",
  authDomain: "agenda-acs-6c9eb.firebaseapp.com",
  projectId: "agenda-acs-6c9eb",
  storageBucket: "agenda-acs-6c9eb.firebasestorage.app",
  messagingSenderId: "202229339415",
  appId: "1:202229339415:web:4652fa22bd1f9b2239d352"
};
/* ================================================== */
const V='10.12.2', B=`https://www.gstatic.com/firebasejs/${V}/`;
const $l=s=>document.querySelector(s);
if(!firebaseConfig.apiKey){
  $l('#logMsg').innerHTML='<b>Falta configurar o Firebase.</b><br>Cole o <code>firebaseConfig</code> no começo do arquivo index.html.';
  $l('#btnLogin').disabled=true; $l('#btnEntrar').disabled=true;
} else {
  const { initializeApp } = await import(B+'firebase-app.js');
  const { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut, signInWithEmailAndPassword, updatePassword, EmailAuthProvider, reauthenticateWithCredential } = await import(B+'firebase-auth.js');
  const FS = await import(B+'firebase-firestore.js');
  const app=initializeApp(firebaseConfig);
  const auth=getAuth(app);
  let db;
  try{ db=FS.initializeFirestore(app,{localCache:FS.persistentLocalCache({tabManager:FS.persistentMultipleTabManager()})}); }
  catch(e){ db=FS.getFirestore(app); }
  const PRIVADAS=new Set(['agendamentos','lembretes','afazeres','notas']);
  function adapter(uid){
    const cpath=n=> PRIVADAS.has(n) ? `usuarios/${uid}/${n}` : n;
    const dpath=p=> p==='perfil' ? `usuarios/${uid}` : p;
    const refOps=r=>({ set:b=>FS.setDoc(r,b), merge:b=>FS.setDoc(r,b,{merge:true}), update:b=>FS.updateDoc(r,b), delete:()=>FS.deleteDoc(r) });
    const wrapQ=q=>({
      where:(f,op,v)=>wrapQ(FS.query(q,FS.where(f,op,v))),
      onSnapshot:(next,err)=>FS.onSnapshot(q,{includeMetadataChanges:true},s=>next({docs:s.docs.map(d=>({id:d.id,data:()=>d.data()})),metadata:s.metadata}),err)
    });
    return {
      collection:n=>{ const c=FS.collection(db,cpath(n)); const w=wrapQ(c); w.doc=id=>refOps(FS.doc(c,id)); return w; },
      doc:p=>{ const r=FS.doc(db,dpath(p)); return { ...refOps(r), onSnapshot:(next,err)=>FS.onSnapshot(r,{includeMetadataChanges:true},s=>next({exists:s.exists(),data:()=>s.data(),metadata:s.metadata}),err) }; }
    };
  }
  const provider=new GoogleAuthProvider(); provider.setCustomParameters({prompt:'select_account'});
  $l('#btnLogin').onclick=async()=>{
    $l('#logErr').textContent='';
    try{ await signInWithPopup(auth,provider); }
    catch(e){
      if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment','auth/cancelled-popup-request'].includes(e.code)) return signInWithRedirect(auth,provider);
      if(e.code!=='auth/popup-closed-by-user') $l('#logErr').textContent='Não consegui entrar ('+e.code+').';
    }
  };
  getRedirectResult(auth).catch(e=>{ $l('#logErr').textContent='Não consegui entrar ('+e.code+').'; });
  window.sairFirebase=()=>signOut(auth);
  const DOMINIO='@acs.agenda';
  const normUser=u=>String(u||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,'');
  $l('#formLogin').onsubmit=async ev=>{
    ev.preventDefault(); $l('#logErr').textContent='';
    const u=normUser($l('#logUser').value), p=$l('#logPass').value;
    if(!u||!p){ $l('#logErr').textContent='Preencha usuário e senha.'; return; }
    $l('#btnEntrar').disabled=true;
    try{ await signInWithEmailAndPassword(auth, u.includes('@')?u:u+DOMINIO, p); }
    catch(e){ $l('#logErr').textContent = ['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-email'].includes(e.code) ? 'Usuário ou senha incorretos.' : e.code==='auth/too-many-requests' ? 'Muitas tentativas. Espere alguns minutos.' : 'Não consegui entrar ('+e.code+').'; }
    finally{ $l('#btnEntrar').disabled=false; }
  };
  window.trocarSenha=async(atual,nova)=>{ const u=auth.currentUser; await reauthenticateWithCredential(u, EmailAuthProvider.credential(u.email, atual)); await updatePassword(u, nova); };
  onAuthStateChanged(auth,u=>{
    if(u){
      const em=(u.email||'').toLowerCase(), local=em.endsWith(DOMINIO)?em.slice(0,-DOMINIO.length):null;
      const nome=local?local.charAt(0).toUpperCase()+local.slice(1):u.displayName;
      $l('#login').classList.add('hidden'); $l('#logPass').value='';
      conectar(adapter(local||u.uid),{email:u.email,displayName:nome,uid:u.uid,usuario:local,pid:local||u.uid});
    }
    else { desconectar(); S.user=null; S.modo='carregando'; render(); $l('#login').classList.remove('hidden'); }
  });
}
</script>
